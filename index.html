<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planejador semanal</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef5;--sf:#fff;--ink:#1a2036;--mut:#7a8199;--ln:#e7eaf3;--hi:#e5484d;--md:#f0a000;--lo:#2fa76a;--now:#f4f6fe;--hov:#f3f4fa;--inp:#f7f8fc;--th:rgba(26,32,54,.04);--pb:#1a2036;--pf:#fff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e121c;--sf:#161b29;--ink:#e9ecf6;--mut:#8b93ab;--ln:#262d42;--hi:#ff6b72;--md:#ffb629;--lo:#3ccf8e;--now:#1b2340;--hov:#202840;--inp:#0f1320;--th:rgba(255,255,255,.05);--pb:#e9ecf6;--pf:#161b29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e121c;--sf:#161b29;--ink:#e9ecf6;--mut:#8b93ab;--ln:#262d42;--hi:#ff6b72;--md:#ffb629;--lo:#3ccf8e;--now:#1b2340;--hov:#202840;--inp:#0f1320;--th:rgba(255,255,255,.05);--pb:#e9ecf6;--pf:#161b29;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:22px 26px 16px;flex:none}
.rng{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.tag{display:block;margin-top:3px;color:var(--mut);font-size:13px;font-weight:500}
.nav{display:flex;margin-left:10px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);overflow:hidden}
.nav .btn{border:0;border-radius:0;background:none;padding:8px 13px}.nav .btn+.btn{border-left:1px solid var(--ln)}
.sp{flex:1}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:11px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:13px;transition:background .15s}
.btn:hover{background:var(--hov)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.t:focus-visible,.add:focus-visible{outline:2px solid #4f6bff;outline-offset:2px}
.btn.pri{background:var(--pb);border-color:var(--pb);color:var(--pf)}.btn.pri:hover{opacity:.88}
.leg{display:flex;gap:14px;margin-right:6px}.leg span{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12.5px;font-weight:500}
.leg i{width:11px;height:11px;border-radius:4px;border:2.5px solid var(--p)}
.board{flex:1;min-height:0;margin:0 26px 26px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--sf);border:1px solid var(--ln);border-radius:24px;overflow:hidden;box-shadow:0 1px 2px rgba(26,32,54,.05),0 24px 60px -34px rgba(26,32,54,.3)}
.day{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--ln);padding:0 12px 10px}.day:first-child{border-left:0}
.day.now{background:var(--now)}
.hd{flex:none;padding:18px 0 12px}
.hd small{display:block;color:var(--mut);font-size:12.5px;font-weight:600;margin-bottom:4px}
.hd b{display:inline-block;font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15;padding:0 2px}
.day.now .hd small{color:var(--ink)}.day.now .hd b{background:var(--ink);color:var(--bg);border-radius:11px;padding:0 10px}
.rows{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;cursor:cell}.rows::-webkit-scrollbar{display:none}
.t{display:flex;gap:10px;align-items:center;padding:11px 6px;margin:0 -6px;border-bottom:1px solid var(--ln);cursor:pointer;border-radius:10px;transition:background .15s}
.t:hover{background:var(--th)}
.ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--p);background:none;flex:none;padding:0;cursor:pointer;display:grid;place-items:center;transition:background .15s,transform .15s}
.ck:hover{transform:scale(1.1)}
.bd{flex:1;min-width:0}.tm{display:block;font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--p) 78%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;font-weight:600;font-size:13.5px;line-height:1.3}
.done .ck{background:var(--p)}.done .ck:after{content:"✓";color:#fff;font-weight:700;font-size:12px;line-height:1}.done .tt{text-decoration:line-through;color:var(--mut)}.done .tm{opacity:.55}
.add{flex:none;margin-top:6px;border:0;background:none;text-align:left;padding:8px 0;color:var(--mut);font-weight:600;font-size:12.5px;cursor:pointer}.add:hover{color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(20,25,45,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.ov.on{display:flex}
.mod{background:var(--sf);border-radius:22px;padding:26px;width:100%;max-width:460px;max-height:92vh;overflow:auto;animation:pop .2s;box-shadow:0 40px 90px -24px rgba(20,25,45,.5)}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.mod h2{margin-bottom:6px;font-size:21px;font-weight:600;letter-spacing:-.02em}.mod label{display:block;font-weight:600;margin-top:14px;font-size:12.5px}.mod p{color:var(--mut);font-size:13px}
.mod input,.mod select,.mod textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--inp)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;margin-top:6px}.chip{flex:1;border:2px solid var(--c);border-radius:12px;background:none;padding:8px;cursor:pointer;font-weight:600}.chip.on{background:var(--c);color:#fff}
.act{display:flex;gap:8px;margin-top:22px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{margin-left:12px;background:none;border:0;color:#9db6ff;font-weight:700;cursor:pointer}
.pp{flex:none;opacity:0;border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:4px 6px;border-radius:7px}.pp:hover{background:var(--th);color:var(--ink)}
.t:hover .pp,.t:focus-within .pp,.pp:focus-visible{opacity:1}@media (hover:none){.pp{opacity:.7}}
.t.drag{opacity:.4}.day.over{outline:2px dashed var(--mut);outline-offset:-6px}
@keyframes ck{40%{transform:scale(1.4)}}@keyframes ring{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--p) 55%,transparent)}to{box-shadow:0 0 0 14px transparent}}@keyframes flash{from{background:color-mix(in srgb,var(--p) 22%,transparent)}}
.just{animation:flash .7s}.just .ck{animation:ck .4s,ring .6s}
#sync{color:var(--mut);font-size:12.5px;font-weight:500}
@media (max-width:1250px){.leg{display:none}.rng{font-size:23px}}
@media (max-width:800px){html,body{height:auto}body{display:block;overflow:auto}.top{padding:16px 14px 12px}.nav{margin-left:0}.board{grid-template-columns:1fr;margin:0 14px 24px}.day{border-left:0;border-top:1px solid var(--ln)}.day:first-child{border-top:0}.rows{overflow:visible}.sp{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
<div><div class="rng" id="range"></div><span class="tag" id="tag"></span></div>
<div class="nav"><button class="btn" id="pv" aria-label="Semana anterior">‹</button><button class="btn" id="td">Hoje</button><button class="btn" id="nx" aria-label="Próxima semana">›</button></div>
<span class="sp"></span>
<div class="leg"><span style="--p:var(--hi)"><i></i>Alta</span><span style="--p:var(--md)"><i></i>Média</span><span style="--p:var(--lo)"><i></i>Baixa</span></div>
<button class="btn" id="cp">Copiar semana anterior</button>
<button class="btn" id="clr">Limpar</button>
<span id="sync" hidden></span>
<button class="btn" id="th">Tema</button>
<button class="btn" id="bkb">Backup</button>
<button class="btn pri" id="nw">Novo</button>
</header>
<main class="board" id="board"></main>

<div class="ov" id="ov"><div class="mod">
<h2 id="mt">Novo compromisso</h2>
<label>Título<input id="ft" autocomplete="off"></label>
<div class="two"><label>Dia<input type="date" id="fd"></label><label>Categoria<select id="fc"></select></label></div>
<div class="two"><label>Início<input type="time" id="fs"></label><label>Fim<input type="time" id="fe"></label></div>
<label>Repetir<select id="fr"><option value="">Não repetir</option><option value="daily">Todo dia</option><option value="weekdays">Dias úteis</option><option value="weekly">Toda semana, no mesmo dia</option></select></label>
<label>Prioridade</label><div class="chips" id="fp"></div>
<label>Observações<textarea id="fn" rows="2"></textarea></label>
<div class="act"><button class="btn" id="del">Excluir</button><span class="sp"></span><button class="btn" id="cx">Cancelar</button><button class="btn pri" id="sv">Salvar</button></div>
</div></div>
<div class="ov" id="ov2"><div class="mod">
<h2>Backup dos dados</h2>
<p>Copie o texto abaixo e guarde onde quiser. Para restaurar, cole um backup e toque em Importar (substitui tudo).</p>
<textarea id="bk" rows="8" style="width:100%;margin-top:10px;border:1px solid var(--ln);border-radius:12px;background:#0b0c12;padding:9px"></textarea>
<div class="act"><button class="btn" id="bcp">Copiar</button><button class="btn" id="bim">Importar</button><span class="sp"></span><button class="btn pri" id="bcl">Fechar</button></div>
</div></div>
<div class="ov" id="ov3"><div class="mod"><h2>Entrar para sincronizar</h2><p>Use o mesmo e-mail e senha no PC e no celular.</p>
<label>E-mail<input type="email" id="le" autocomplete="email"></label><label>Senha<input type="password" id="lp" autocomplete="current-password"></label>
<p id="lm" style="margin-top:10px;color:var(--hi)"></p>
<div class="act"><button class="btn" id="lx">Agora não</button><span class="sp"></span><button class="btn" id="su">Criar conta</button><button class="btn pri" id="lg">Entrar</button></div></div></div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const KEY='planejador-semanal-v1',DN=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const DC=['#3b9bff','#3ecf7f','#a855f7','#ffa826','#ff4d6d','#19d9d0','#8b6cf6'];
const CAT=['Estudo','Trabalho','Pessoal','Saúde','Projetos'];
const PR={alta:['Alta','var(--hi)'],media:['Média','var(--md)'],baixa:['Baixa','var(--lo)']};
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dt=s=>new Date(s+'T00:00:00'),add=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const mins=t=>{const a=t.split(':');return +a[0]*60+ +a[1]},hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),fmt=(s,o)=>dt(s).toLocaleDateString('pt-BR',o);
let S={items:[],weeks:{}},fresh=true;
try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);fresh=false}}catch(e){}
const SB_URL='https://pyjbddchdpzbtkmefkgx.supabase.co',SB_KEY='';let sb=null,usr=null,pt,jd=null,dg=null;
const setSync=t=>{const e=$('#sync');e.textContent=t;e.hidden=false};
function push(){if(!sb||!usr)return;clearTimeout(pt);setSync('Salvando');pt=setTimeout(async()=>{const r=await sb.from('planner_state').upsert({user_id:usr,data:S,updated_at:new Date().toISOString()});setSync(r.error?'Erro ao sincronizar':'Sincronizado')},800)}
const save=()=>{S.at=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()};
const today=iso(new Date()),tm=mon(new Date());
let ws=new Date().getDay()===0?add(tm,7):tm,cur=null,pr='media';
if(fresh){S.items=[['Revisar Matemática',0,'08:00','10:00','alta','Estudo'],['Reunião de alinhamento',1,'14:00','15:00','media','Trabalho'],
['Treino',1,'18:00','19:00','baixa','Saúde'],['Projeto pessoal',2,'09:00','11:30','media','Projetos'],
['Entregar relatório',3,'10:00','12:00','alta','Trabalho'],['Leitura',4,'20:00','21:00','baixa','Pessoal'],
['Almoço em família',5,'12:00','14:00','baixa','Pessoal']].map(a=>({id:uid(),title:a[0],date:add(ws,a[1]),start:a[2],end:a[3],pr:a[4],cat:a[5],status:'planejado',notes:''}));save()}

const occ=(it,s)=>it.rec?(s>=it.date&&!(it.sk||[]).includes(s)&&(it.rec==='daily'||(it.rec==='weekdays'&&(dt(s).getDay()+6)%7<5)||(it.rec==='weekly'&&dt(s).getDay()===dt(it.date).getDay()))):it.date===s;
const isDone=(it,s)=>it.rec?!!(it.dn&&it.dn[s]):it.status==='feito';
function render(){const e=add(ws,6),m1=fmt(ws,{month:'long'}),m2=fmt(e,{month:'long'}),d1=dt(ws).getDate(),d2=dt(e).getDate();
$('#range').textContent=m1===m2?`${d1} a ${d2} de ${m2}`:`${d1} de ${m1} a ${d2} de ${m2}`;
const lb=ws===tm?'Esta semana':ws===add(tm,7)?'Próxima semana':ws===add(tm,-7)?'Semana anterior':'';
$('#tag').textContent=lb+(lb?', ':'')+dt(e).getFullYear();
let h='';for(let d=0;d<7;d++){const s=add(ws,d),L=S.items.filter(i=>occ(i,s)).sort((a,b)=>mins(a.start)-mins(b.start));
h+=`<section class="day${s===today?' now':''}" data-d="${s}"><div class="hd"><small>${DN[d]}</small><b>${dt(s).getDate()}</b></div><div class="rows" data-add="${s}">`;
L.forEach(i=>{h+=`<div class="t${isDone(i,s)?' done':''}${jd===i.id+s?' just':''}" tabindex="0" draggable="true" data-id="${i.id}" style="--p:${PR[i.pr][1]}" title="${esc(i.cat||'')}"><button class="ck" data-chk="${i.id}" aria-label="Concluir"></button><div class="bd"><span class="tm">${i.start} às ${i.end}${i.rec?' ↻':''}</span><span class="tt">${esc(i.title)}</span></div><button class="pp" data-pp="${i.id}" title="Adiar para amanhã" aria-label="Adiar para amanhã">→</button></div>`});
h+=`</div><button class="add" data-add="${s}">+ Adicionar</button></section>`}
$('#board').innerHTML=h;jd=null}

let tt;function toast(m,u){const t=$('#toast');t.innerHTML=esc(m)+(u?'<button id="un">Desfazer</button>':'');t.classList.add('on');
if(u)$('#un').onclick=()=>{u();t.classList.remove('on')};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),5000)}
const snap=()=>{const s=JSON.stringify(S);return()=>{S=JSON.parse(s);save();render()}};
function setPr(k){pr=k;$('#fp').innerHTML=Object.keys(PR).map(x=>`<button type="button" class="chip${x===k?' on':''}" data-p="${x}" style="--c:${PR[x][1]}">${PR[x][0]}</button>`).join('')}
function openM(v){cur=v.id?v:null;$('#mt').textContent=cur?'Editar compromisso':'Novo compromisso';
$('#ft').value=v.title||'';$('#fd').value=v.date||(ws<=today&&today<=add(ws,6)?today:ws);$('#fs').value=v.start||'09:00';$('#fe').value=v.end||'10:00';$('#fn').value=v.notes||'';$('#fr').value=v.rec||'';
$('#fc').innerHTML=CAT.map(k=>`<option${k===v.cat?' selected':''}>${k}</option>`).join('');
setPr(v.pr||'media');$('#del').style.visibility=cur?'visible':'hidden';$('#ov').classList.add('on');$('#ft').focus()}
const closeM=()=>{$('#ov').classList.remove('on');$('#ov2').classList.remove('on')};
$('#fp').onclick=e=>{const p=e.target.dataset.p;if(p)setPr(p)};
$('#sv').onclick=()=>{const t=$('#ft').value.trim();if(!t){$('#ft').focus();return}
const s=$('#fs').value||'09:00';let e=$('#fe').value||'10:00';if(mins(e)<=mins(s))e=hm(Math.min(mins(s)+30,1439));
const o={title:t,date:$('#fd').value||ws,start:s,end:e,pr,cat:$('#fc').value,notes:$('#fn').value,rec:$('#fr').value};
if(cur)Object.assign(cur,o);else S.items.push({id:uid(),status:'planejado',...o});
save();closeM();ws=mon(dt(o.date));render()};
$('#del').onclick=()=>{const u=snap();S.items=S.items.filter(i=>i!==cur);save();closeM();render();toast('Compromisso excluído',u)};
$('#cx').onclick=closeM;$('#nw').onclick=()=>openM({});
const act=e=>{const sd=e.target.closest('.day'),ds=sd&&sd.dataset.d,c=e.target.closest('[data-chk]'),pp=e.target.closest('[data-pp]');
if(pp){mv(pp.dataset.pp,ds,add(ds,1));return}
if(c){const i=S.items.find(x=>x.id===c.dataset.chk);if(i.rec){i.dn=i.dn||{};i.dn[ds]=!i.dn[ds];if(i.dn[ds])jd=i.id+ds}else{i.status=i.status==='feito'?'planejado':'feito';if(i.status==='feito')jd=i.id+ds}save();render();return}
const b=e.target.closest('[data-id]');if(b){openM(S.items.find(x=>x.id===b.dataset.id));return}
const a=e.target.closest('[data-add]');if(a)openM({date:a.dataset.add})};
$('#board').addEventListener('click',act);
$('#board').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('t'))act(e)});
$('#cp').onclick=()=>{const p=S.items.filter(i=>i.date>=add(ws,-7)&&i.date<=add(ws,-1)&&!i.rec);if(!p.length){toast('A semana anterior está vazia');return}
const u=snap();p.forEach(i=>S.items.push({...i,id:uid(),date:add(i.date,7),status:'planejado'}));save();render();toast(p.length+' itens copiados',u)};
$('#clr').onclick=()=>{const u=snap();S.items=S.items.filter(i=>i.rec||i.date<ws||i.date>add(ws,6));save();render();toast('Semana limpa',u)};
$('#pv').onclick=()=>{ws=add(ws,-7);render()};$('#nx').onclick=()=>{ws=add(ws,7);render()};
$('#td').onclick=()=>{ws=new Date().getDay()===0?add(tm,7):tm;render()};
$('#bkb').onclick=()=>{$('#bk').value=JSON.stringify(S);$('#ov2').classList.add('on')};$('#bcl').onclick=closeM;
$('#bcp').onclick=()=>{$('#bk').select();try{navigator.clipboard.writeText($('#bk').value).then(()=>toast('Backup copiado'),()=>toast('Selecionado: use Ctrl+C'))}catch(e){toast('Selecionado: use Ctrl+C')}};
$('#bim').onclick=()=>{try{const j=JSON.parse($('#bk').value);if(!Array.isArray(j.items))throw 0;S={items:j.items,weeks:j.weeks||{}};save();closeM();render();toast('Backup importado')}catch(e){toast('Texto inválido: cole um backup completo')}};
function mv(id,s,t){const it=S.items.find(x=>x.id===id);if(!it||s===t)return;const u=snap();
if(it.rec){it.sk=(it.sk||[]).concat(s);const c={...it,id:uid(),rec:'',date:t,status:isDone(it,s)?'feito':'planejado'};delete c.sk;delete c.dn;S.items.push(c)}else it.date=t;
save();render();toast('Movido para '+fmt(t,{weekday:'long',day:'numeric'}),u)}
const B=$('#board');
B.addEventListener('dragstart',e=>{const t=e.target.closest('.t');if(!t)return;dg={id:t.dataset.id,s:t.closest('.day').dataset.d};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dg.id);t.classList.add('drag')});
B.addEventListener('dragover',e=>{const d=e.target.closest('.day');if(d&&dg){e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==d&&x.classList.remove('over'));d.classList.add('over')}});
B.addEventListener('drop',e=>{const d=e.target.closest('.day');if(d&&dg){e.preventDefault();const g=dg;dg=null;mv(g.id,g.s,d.dataset.d)}});
B.addEventListener('dragend',()=>{dg=null;render()});
function applyTh(){if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme}
$('#th').onclick=()=>{const dk=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;S.theme=dk?'light':'dark';applyTh();save()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();return}
if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||document.querySelector('.ov.on'))return;
const k=e.key.toLowerCase();if(k==='n'){e.preventDefault();openM({})}else if(e.key==='ArrowLeft'){ws=add(ws,-7);render()}else if(e.key==='ArrowRight'){ws=add(ws,7);render()}else if(k==='t')$('#td').click();else if(k==='d')$('#th').click()});
async function pull(){const r=await sb.from('planner_state').select('data').maybeSingle();if(r.error){setSync('Erro ao sincronizar');return}
const d=r.data&&r.data.data;if(d&&(d.at||0)>=(S.at||0)){S=d;S.weeks=S.weeks||{};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}applyTh();render();setSync('Sincronizado')}else push()}
async function auth(m){const r=await sb.auth[m]({email:$('#le').value.trim(),password:$('#lp').value});if(r.error){$('#lm').textContent=r.error.message;return}
if(!r.data.session){$('#lm').textContent='Confirme o e-mail e depois toque em Entrar.';return}usr=r.data.session.user.id;$('#ov3').classList.remove('on');await pull()}
$('#lg').onclick=()=>auth('signInWithPassword');$('#su').onclick=()=>auth('signUp');$('#lx').onclick=()=>$('#ov3').classList.remove('on');
async function initSB(){if(!SB_URL||!SB_KEY)return;try{await new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';x.onload=ok;x.onerror=no;document.head.appendChild(x)});
sb=supabase.createClient(SB_URL,SB_KEY);const r=await sb.auth.getSession();if(r.data.session){usr=r.data.session.user.id;await pull()}else $('#ov3').classList.add('on')}catch(e){toast('Sem conexão com o banco')}}
applyTh();render();initSB();
</script>
</body>
</html>
